[versions]
kotlin = "2.4.10"
# Analysis API releases lag Kotlin; 2.3.20 is the latest proper release (see docs/plan.md §4).
# The IntelliJ platform version must match what that Kotlin tag was built against
# (gradle/versions.properties in JetBrains/kotlin @ v2.3.20).
analysisApi = "2.3.20"
intellijPlatform = "251.27812.49"
# Keep in step with gradle/wrapper/gradle-wrapper.properties so the cached distribution is reused.
gradleToolingApi = "9.5.0"
jtokkit = "1.1.0"
kotlinxSerialization = "1.7.3"
# Runs the embedding baseline's sentence-transformer locally: no API key, no per-run cost, and a
# benchmark anyone can reproduce offline once the model is cached.
djl = "0.36.0"
slf4j = "2.0.16"

[libraries]
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
djl-api = { module = "ai.djl:api", version.ref = "djl" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djl" }
djl-onnxruntime = { module = "ai.djl.onnxruntime:onnxruntime-engine", version.ref = "djl" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
